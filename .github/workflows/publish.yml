name: Publish

# Publishes @hostess/nextjs to npm when a GitHub Release is published, via npm
# OIDC trusted publishing — no stored token. Configure the trusted publisher at
# npmjs.com → @hostess/nextjs → Settings → Trusted Publisher → GitHub Actions
# (org: howl-cloud, repo: hostess-js, workflow: publish.yml). Provenance is
# generated automatically under trusted publishing.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Upgrade npm for OIDC trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @hostess/nextjs build
      - name: Publish (OIDC trusted publishing — provenance automatic)
        run: npm publish --access public
        working-directory: packages/nextjs
